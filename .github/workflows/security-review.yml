name: Security Review

permissions:
  pull-requests: write  # Needed for leaving PR comments
  contents: read

on:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          # SECURITY-POLICY.md is this repo's threat model (see the file
          # itself, and specs/FEATURE-SPEC-security-loop.md) — fed to the
          # scanner as both context and false-positive filtering guidance.
          custom-security-scan-instructions: SECURITY-POLICY.md
          false-positive-filtering-instructions: SECURITY-POLICY.md
