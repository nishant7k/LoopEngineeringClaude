name: CI/CD

on:
  push:
    branches:
      - main
  # Lets the demo be re-run on demand without needing a new commit.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    name: Lint & Design Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Design tokens + accessibility baseline
        run: node scripts/check-design-standards.js

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Structural syntax gate
        run: node --check js/app.js

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npm install --no-save playwright@1.62.1

      - name: Install Chromium (skips download on cache hit)
        run: npx playwright install --with-deps chromium

      - name: Real-browser e2e smoke test
        run: node tests/e2e.js index.html

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble dist
        run: |
          mkdir -p dist
          cp -r index.html monitoring.html before-after.html loop-live.html feature-flags.json css js dist/

      - name: Cache-bust static assets
        # Ties every deploy's css/js references to the commit SHA, so a
        # browser tab that cached an older app.js/styles.css always picks
        # up the new build instead of silently mixing old JS with new HTML.
        run: |
          for f in dist/*.html; do
            sed -i "s#css/styles.css#css/styles.css?v=${GITHUB_SHA:0:7}#g; s#js/app.js#js/app.js?v=${GITHUB_SHA:0:7}#g" "$f"
          done

      - name: Generate build metadata
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > dist/build-metadata.json
          {
            "buildNumber": "${{ github.run_number }}",
            "commitSha": "${{ github.sha }}",
            "commitShaShort": "${SHORT_SHA}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "timestamp": "${TIMESTAMP}",
            "workflowRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Build summary
        run: |
          {
            echo "### Build Summary"
            echo "- Run number: ${{ github.run_number }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  deploy:
    name: Deploy
    needs: build
    # Guards against workflow_dispatch runs from non-main refs deploying stale content.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ./dist

      - uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
